[package]
name = "whisperai-client"
version = "0.1.0"
description = "WhisperAI - Production-Grade Edge Stealth AI Copilot"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "whisperai_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# platform backends must be enabled explicitly on keyring 3.x — without them it
# falls back to an in-memory mock store and the saved key vanishes on restart.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
rubato = "0.16"
rtrb = "0.3"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = "0.2.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Accessibility",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com"
]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true
